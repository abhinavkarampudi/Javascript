<!DOCTYPE html>
<html lang="en">

<head>

    <title>My Playlist Sorter</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>

    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted mb-4">Sort and Label your Music Playlist using Javascript Array Methods.</p>
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A-Z</button>
                <button class="btn btn-primary mr-2" onclick="sortZA()">Sort Z-A</button>
                <div id="nameResult" class="box p-3 mt-3 rounded">

                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label every playcount</h3>
                <button class="btn btn-primary mr-2" onclick="addLabel()">Add Play Label</button>
                <div id="labelResult" class="box p-3 mt-3 rounded">

                </div>
            </div>
        </div>
    </div>
    <script>
        var songs = ["Zoom", "Bounce", "Glow", "Rush", "Spark"];
        function sortAZ() {
            songs.sort();
            document.getElementById("nameResult").innerHTML = songs;
        }
        function sortZA() {
            songs.reverse();
            document.getElementById("nameResult").innerHTML = songs;
        }
        function addLabel() {
            var l = songs.map(function (c) { return c + "Plays"; }
            );
            document.getElementById("labelResult").innerHTML = l;
        }

    </script>
</body>

</html>
