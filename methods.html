<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript String Methods and Loops</h2>
    <p>Numbers from 1 to 10</p>
    <p id="result"></p>

    <script>
        var number = " ";

        for (i = 1; i < 11; i++) {
            number += i + "<br>";
        }

        document.getElementById("result").innerHTML = number;

        document.write("The random value is " + Math.floor(Math.random() * 100));

        var date = new Date();
        document.write("<br>Today's Date is " + date.getDate());

        var roundedNumber = Math.round(Math.random() * 100);
        document.write("<br>Rounded random number is " + roundedNumber);
    </script>
</body>

</html>
