<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Magic World</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

    </style>
</head>

<body>
    <div class="card mb-4">
        <div class="card-body">

            <h3 class="card-title"> Catch the Mistake </h3>
            <input id="divIn" class="form-control mb-2" placeholder="Divide 100/n">
            <button class="btn btn-warning" onclick="trysafe()">Try it</button>
            <div id="errResult" class="box p-3 mt-3 rounded">
                Type a number or something silly and see what happens
            </div>
        </div>
    </div>
    <script>
        function trysafe() {
            var n = document.getElementById("divIn").value;
            if (n === "" || isNaN(n)) {
                throw "That is not a no";
            }
            document.getElementById("errorResult").innerHTML = "100/" + n + "=" + (100 / Number(n)) + "Well Done";
        }
    </script>
</body>

</html>
