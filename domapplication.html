<!DOCTYPE html>
<html lang="en">

<head>
    <title>DOM</title>
    <style>
        body {
            background-image: linear-gradient(to right, cyan, beige);
        }

        h1 {
            color: chocolate;
            text-align: center;

        }

        #zoo {
            color: tomato;
        }

        .zone {
            color: chocolate;
        }
    </style>
</head>

<body>
    <h1>My Zoo</h1>
    <p>Use JavaScript and the DOM to add animals to Each Cage!</p>
    <!-- DOM tree: Zoo is the Parent Element Node
    zoo divs are child element nodes
    animals names inside each span are next nodes -->
    <div id="zoo">
        <div class="zone">
            Zone 1 <span id="zone1"></span>
        </div>
        <div class="zone">
            Zone 2 <span id="zone2"></span>
        </div>
        <div class="zone">
            Zone 3 <span id="zone3"></span>
        </div>
        <div class="zone">
            Zone 4 <span id="zone4"></span>
        </div>
    </div>
    <br>
    <button onclick="openzone()">Open The Zone</button>
    <script>
        function openzone() {
            document.getElementById("zone1").innerHTML = "Lion 🦁";
            document.getElementById("zone2").innerHTML = "Cheetah 🐆";
            document.getElementById("zone3").innerHTML = "Blue Whale 🐋";
            document.getElementById("zone4").innerHTML = "Mammoth 🦣";
        }
    </script>
</body>

</html>
