<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favourite Person Profile</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">My Favourite Person</h1>

        <div class="card mx-auto shadow" style="max-width: 500px;">
            <div class="card-body text-center">

                <h2 class="card-title text-primary">
                    Cristiano Ronaldo
                </h2>

                <p class="card-text">
                    <strong>Name:</strong>
                    <span id="name"></span>
                </p>

                <p class="card-text">
                    <strong>Relationship:</strong>
                    <span id="relationship"></span>
                </p>

                <p class="card-text">
                    <strong>Favourite Activity:</strong>
                    <span id="activity"></span>
                </p>

                <p class="card-text">
                    <strong>City:</strong>
                    <span id="city"></span>
                </p>

            </div>
        </div>

        <div class="card mt-4 mx-auto shadow" style="max-width: 700px;">
            <div class="card-body">
                <h3 class="text-success">JavaScript Object</h3>

                <pre id="codeBox" class="bg-dark text-light p-3"></pre>
            </div>
        </div>

    </div>

    <script>

        let favouritePerson = {
            name: "Cristiano Ronaldo",
            relationship: "Football Idol",
            activity: "Playing Football",
            city: "Riyadh"
        };

        document.getElementById("name").innerHTML = favouritePerson.name;
        document.getElementById("relationship").innerHTML = favouritePerson.relationship;

        document.getElementById("activity").innerHTML = favouritePerson["activity"];
        document.getElementById("city").innerHTML = favouritePerson["city"];

        document.getElementById("codeBox").innerHTML =
            "let favouritePerson = " +
            JSON.stringify(favouritePerson, null, 2);

    </script>

</body>

</html>
