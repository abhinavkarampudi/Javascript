<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Planet Cards</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: sans-serif;
        }

        .cards {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        #card1,
        #card2,
        #card3 {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: fit-content;
            min-width: 250px;
        }

        #card2::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            background: transparent;
            z-index: -1;
            box-shadow:
                123px 456px #fff, 789px 234px #fff, 456px 890px #fff, 345px 678px #fff,
                901px 234px #fff, 567px 890px #fff, 12px 345px #fff, 678px 901px #fff,
                234px 567px #fff, 890px 123px #fff, 543px 210px #fff, 987px 654px #fff,
                321px 987px #fff, 654px 321px #fff, 150px 750px #fff, 850px 250px #fff,
                950px 650px #fff, 350px 450px #fff, 550px 150px #fff, 750px 850px #fff,
                1100px 300px #fff, 1300px 700px #fff, 1400px 200px #fff, 1200px 900px #fff,
                50px 950px #fff, 1600px 450px #fff, 1750px 800px #fff, 1850px 150px #fff;
        }

        #card3::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 2px;
            background: transparent;
            z-index: -1;
            box-shadow:
                234px 789px #fff, 890px 456px #fff, 678px 123px #fff, 901px 567px #fff,
                123px 890px #fff, 567px 123px #fff, 345px 901px #fff, 789px 567px #fff,
                1050px 450px #fff, 1250px 150px #fff, 1550px 850px #fff, 1650px 350px #fff;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 3px;
            background: transparent;
            z-index: 1;
            box-shadow:
                456px 234px #fff, 123px 678px #fff, 890px 901px #fff, 567px 345px #fff,
                1150px 600px #fff, 1450px 400px #fff, 1800px 700px #fff;
            animation: twinkle 3s infinite ease-in-out alternate;
        }

        body::after {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(106, 17, 203, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 20%;
            left: 30%;
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1557b0;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="cards">
        <h1>My Planet Cards </h1>
        <p>Use a JavaScript class to build planet cards</p>
        <button onclick="showPlanets()">Show Planets</button>

        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>

    <script>
        class Planet {
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return "<strong>" + this.name + "</strong>: " + this.fact;
            }
        }

        function showPlanets() {
            let p1 = new Planet("Earth", "It is the only Planet with Life");
            let p2 = new Planet("Mars", "Known as the Red planet");
            let p3 = new Planet("Saturn", "Has rings made of ice and dust");

            document.getElementById("card1").innerHTML = p1.describe();
            document.getElementById("card2").innerHTML = p2.describe();
            document.getElementById("card3").innerHTML = p3.describe();
        }
    </script>
</body>

</html>
