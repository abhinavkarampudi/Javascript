<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>
    <style>
        #guess {
            width: 100px;
            height: 20px;

        }

        body {
            background-image: linear-gradient(to right, pink, cyan, yellow, lightblue);
            text-align: center;

        }

        #click {
            color: cadetblue;
            padding: 20px;
            box-shadow: darkgoldenrod;
            border-radius: 20px;
            cursor: pointer;
            border-color: brown;
        }
    </style>
</head>

<body>
    <h1>Lucky Draw</h1>
    <p>Enter Your Name And Guess A Number To Win</p>
    <input type="text" id="name" placeholder="Your Name" required>
    <br>
    <p id="msg-name"></p>
    <input type="number" id="guess" placeholder="Guess a number(1-5)" min="1" max="5" required>
    <p id="msg-guess"></p>
    <p id="age"></p>
    <input type="number" id="age" placeholder="Enter your age" required>
    <button onclick="checkForm()" id="click">Try Your Luck</button>
    <p id="result"></p>
    <p id="timer"></p>
    <script>
        setInterval(function () {
            seconds = seconds + 1;
            document.getElementById("timer").textContent = "You Have Been Here For " + seconds + " Seconds";
        }, 1000)
        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;
            if (name == "") {
                document.getElementById("msg-name").textContent = "Please Enter Your Name";
                document.getElementById("msg-name").style.color = "red";
                ok = false;

            }
            else {
                document.getElementById("msg-name").textContent = "Great Name";
                document.getElementById("msg-name").style.color = "green";
            }

            if (guess == "") {
                document.getElementById("msg-guess").textContent = "Please Enter A Guess";
                document.getElementById("msg-guess").style.color = "red";
                ok = false;

            }
            else {
                document.getElementById("msg-guess").textContent = "Guess Saved";
                document.getElementById("msg-guess").style.color = "green";
            }

            if (ok == true) {
                var lucky = Math.floor(Math.random() * 5) + 1;
                if (guess == lucky) {
                    document.getElementById("result").textContent = "You Win!!!!!" + name + " The Lucky Number Was " + lucky + "!";
                    document.getElementById("result").style.color = "green";
                }
                else {
                    document.getElementById("result").textContent = "So closeeeee" + name + " The Lucky Number Was" + lucky + ".Try again";
                    document.getElementById("result").stle.color = "Navy";
                }
            }
            if (age <= "18") {
                document.getElementById("age").textContent = "You are Eligible to Play";
                document.getElementById("age").style.color = "green";
            }
            else {
                document.getElementById("age").textContent = "You are Not Eligible to Play";
                document.getElementById("age").style.color = "red";
            }
        }

    </script>
</body>

</html>
