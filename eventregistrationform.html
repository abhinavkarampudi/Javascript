<!DOCTYPE html>
<html>

<head>
    <title>Event Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff, #ede9fe);
            color: #222222;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 520px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #c7d2fe;
            border-radius: 24px;
            margin: 20px auto;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(79, 70, 229, 0.18);
            transition: 0.3s ease;
            animation: fadeIn 0.8s ease;
        }

        .form-card:hover {
            box-shadow: 0 25px 60px rgba(79, 70, 229, 0.25);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #4338ca;
            font-size: 30px;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
            margin-top: 18px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1.5px solid #c7d2fe;
            border-radius: 10px;
            font-size: 15px;
            background-color: #f8faff;
            color: #1e293b;
            outline: none;
            transition: 0.3s ease;
        }

        input:hover,
        select:hover {
            border-color: #818cf8;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.13);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 25px;
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.25);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #3730a3, #6d28d9);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        #feedback {
            margin-top: 22px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            line-height: 1.8;
            background: #f1f5f9;
            color: #64748b;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .success {
            background: linear-gradient(135deg, #dcfce7, #f0fdf4) !important;
            color: #166534 !important;
            border: 2px solid #22c55e;
        }

        .error {
            background: linear-gradient(135deg, #fee2e2, #fff1f2) !important;
            color: #991b1b !important;
            border: 2px solid #ef4444;
        }

        @media (max-width: 550px) {
            .form-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <h1>Event Registration Form</h1>

        <p>
            Fill in the form to register for the school event and generate your event pass.
        </p>

        <form id="eventForm">

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" required minlength="3" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label for="age">Age</label>
            <input type="number" id="age" required min="8" max="18" placeholder="Enter your age">

            <label for="eventName">Choose Event</label>
            <select id="eventName" required>
                <option value="">Select an event</option>
                <option value="Science Fair">Science Fair</option>
                <option value="Coding Workshop">Coding Workshop</option>
                <option value="Art Competition">Art Competition</option>
                <option value="Sports Day">Sports Day</option>
            </select>

            <button type="button" onclick="registerEvent()">Register Now</button>

        </form>

        <div id="feedback">
            Waiting for registration...
        </div>

    </div>

    <script>
        function registerEvent() {

            let form = document.getElementById("eventForm");
            let feedback = document.getElementById("feedback");

            try {

                // Constraint Validation API
                if (!form.checkValidity()) {
                    throw form.reportValidity();
                }

                // Accessing Form Data
                let studentName = document.getElementById("studentName").value;
                let email = document.getElementById("email").value;
                let age = Number(document.getElementById("age").value);
                let eventName = document.getElementById("eventName").value;

                // Writing Validation Conditions
                if (studentName.length < 3) {
                    throw "Name must have at least 3 characters.";
                }

                if (age < 8 || age > 18) {
                    throw "Age must be between 8 and 18.";
                }

                if (eventName === "") {
                    throw "Please select an event.";
                }

                // DOM Feedback before timer
                feedback.className = "";
                feedback.innerHTML = "Checking your registration details...";

                // Timers and Random Numbers
                setTimeout(function () {
                    let passNumber = Math.floor(Math.random() * 9000) + 1000;

                    feedback.className = "success";
                    feedback.innerHTML =
                        "Registration Successful!<br>" +
                        "Student Name: " + studentName + "<br>" +
                        "Email: " + email + "<br>" +
                        "Age: " + age + "<br>" +
                        "Event: " + eventName + "<br>" +
                        "Your Event Pass Number: EVT-" + passNumber;
                }, 2000);

            } catch (error) {

                // DOM Feedback for errors
                feedback.className = "error";

                if (error !== undefined) {
                    feedback.innerHTML = "Registration failed: " + error;
                } else {
                    feedback.innerHTML = "Please complete all required fields correctly.";
                }
            }
        }
    </script>
</body>

</html>
